<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Jain · The Price Is Right (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Archivo:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --nav:#233038; --nav-line:#3a4a52; --nav-text:#ffffff;
  --bg:#f8f9f8; --surface:#ffffff; --surface-2:#fbfbfa; --border:#e7e6e3; --border-strong:#d6d5d1;
  --text:#1e1d1a; --muted:#6b6b68; --faint:#9b9a96;
  --teal:#447c86; --teal-strong:#366670; --on-teal:#ffffff; --teal-tint:#f3f8f9; --teal-border:#c9dfe2; --teal-text:#3c6f78;
  --red:#d42020; --red-tint:#fdeeee; --amber:#a86700; --amber-tint:#fdf4de; --green:#2f7d47; --green-tint:#e9f4ec;
  --purple:#7664a3; --purple-tint:#efecf7; --scrim:rgba(20,28,32,.45);
  --shadow-up:0 -6px 24px rgba(20,30,35,.08);
  --tray-bg:#eef0ef; --card-ink:#233038; --deco:#f2e8ec; --deco-locked:#dedbd6; --mint:#c0e0d1; --on-mint:#000000;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --nav:#161f24; --nav-line:#2c3940; --bg:#12181b; --surface:#1a2226; --surface-2:#1e272c; --border:#2b363b; --border-strong:#38454b;
    --text:#e9edec; --muted:#a4adaf; --faint:#7d888b;
    --teal:#6aa7b1; --teal-strong:#86bcc5; --on-teal:#0f1b1e; --teal-tint:#1b2d31; --teal-border:#2f4c51; --teal-text:#93cad2;
    --red:#f0766c; --red-tint:#3a1f1d; --amber:#e3b35a; --amber-tint:#3a2f17; --green:#6cc08a; --green-tint:#1c3326;
    --purple:#b0a3e6; --purple-tint:#2a2548; --scrim:rgba(0,0,0,.6); --shadow-up:0 -6px 24px rgba(0,0,0,.35); --tray-bg:#12181b; --card-ink:#e9edec; --deco:#3a2f34; --deco-locked:#38454b; --mint:#2c4a3d; --on-mint:#e9edec;
  }
}
:root[data-theme="dark"]{
  --nav:#161f24; --nav-line:#2c3940; --bg:#12181b; --surface:#1a2226; --surface-2:#1e272c; --border:#2b363b; --border-strong:#38454b;
  --text:#e9edec; --muted:#a4adaf; --faint:#7d888b;
  --teal:#6aa7b1; --teal-strong:#86bcc5; --on-teal:#0f1b1e; --teal-tint:#1b2d31; --teal-border:#2f4c51; --teal-text:#93cad2;
  --red:#f0766c; --red-tint:#3a1f1d; --amber:#e3b35a; --amber-tint:#3a2f17; --green:#6cc08a; --green-tint:#1c3326;
  --purple:#b0a3e6; --purple-tint:#2a2548; --scrim:rgba(0,0,0,.6); --shadow-up:0 -6px 24px rgba(0,0,0,.35); --tray-bg:#12181b; --card-ink:#e9edec; --deco:#3a2f34; --deco-locked:#38454b; --mint:#2c4a3d; --on-mint:#e9edec;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px); height:100%; -webkit-text-size-adjust:100%; text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font-family:Geist, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:6px}
svg.i{width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round}

/* nav — Figma header */
.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:#233038; color:#fafafa; height:64px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; padding:0 16px 0 0}
.logo{display:flex; align-items:center; gap:4px; width:224px; padding:0 24px; background:none; border:0; color:#c9dde1; cursor:pointer; font:300 24px/32px Archivo,sans-serif}
.logo img{display:block; flex:none}
.nav-search{display:flex; align-items:center; gap:10px; height:40px; width:min(576px,100%); margin:0 auto; padding:0 16px; border-radius:999px; background:rgba(255,255,255,.1)}
.nav-search img{display:block; flex:none}
.nav-search input{flex:1; min-width:0; border:0; outline:none; background:transparent; color:#fafafa; font:400 14px/20px Archivo,sans-serif}
.nav-search input::placeholder{color:rgba(250,250,250,.6)}
.nav-search kbd{flex:none; padding:2px 6px; border-radius:8px; background:rgba(255,255,255,.1); color:rgba(250,250,250,.7); font:600 11px/16.5px Archivo,sans-serif}
.crumbs{display:flex; align-items:center; gap:8px; max-width:900px; margin:0 auto; padding:16px 24px 0; font-weight:600; font-size:14px; min-width:0; color:var(--muted)}
.crumbs button{background:none; border:0; color:var(--teal-text); padding:0; cursor:pointer; display:flex; align-items:center; font-weight:500}
.crumbs button:hover{color:var(--text)}
.crumbs .cur{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text)}
.crumbs svg.i{width:14px; height:14px; color:var(--faint)}
body.on-pipe .crumbs, body.on-bid .crumbs{display:none}
.nav-r{display:flex; align-items:center; gap:8px}
.nav-btn{border:0; background:transparent; color:#fafafa; border-radius:8px; padding:8px 10px; font:600 13px/20px Archivo,sans-serif; cursor:pointer; white-space:nowrap}
.nav-btn:hover{background:rgba(255,255,255,.1)}
.nav-ico{width:36px; height:36px; border:0; border-radius:999px; background:rgba(255,255,255,.1); display:grid; place-items:center; cursor:pointer; padding:0}
.nav-ico img{display:block}
.who{display:flex; align-items:center; gap:8px; background:#233f44; border:1px solid #2e535a; border-radius:999px; padding:4px 8px; color:#fafafa; font:600 14px/20px Archivo,sans-serif; letter-spacing:.35px}
.who img{display:block; flex:none}
.avatar{width:24px; height:24px; border-radius:50%; background:#b7b2ca; color:#fafafa; display:grid; place-items:center; font:600 10px/15px Archivo,sans-serif}

/* layout */
.shell{transition:padding-right .2s ease}
.page{max-width:900px; margin:0 auto; padding:28px 24px 250px}
.page.pipe-page{max-width:none; margin:0; padding:28px 32px 240px; background:#f8f9f8; color:#1e1d1a; font-family:Archivo,sans-serif}
body.on-pipe{background:#f8f9f8}
.page.xr-page{max-width:none; margin:0; padding:0 24px 240px; background:#f8f9f8; color:#1e1d1a; font-family:Archivo,sans-serif}
body.on-bid{background:#f8f9f8}
.xr-backbar{background:#fff; margin:0 -24px 16px; padding:0 40px}
.xr-back{display:inline-flex; align-items:center; gap:8px; border:0; background:transparent; color:#4e8d98; font:500 14px/20px Archivo,sans-serif; padding:12px 0; cursor:pointer}
.xr-back img,.xr-actions img,.xr-ico img,.xr-page .link img{display:block}
.xr-hero{background:#fafafa; border:1px solid #e1e3e8; border-radius:12px; padding:24px; display:flex; flex-direction:column; gap:24px; box-shadow:0 1px 1.5px rgba(0,0,0,.1), 0 1px 1px rgba(0,0,0,.1); margin:0 0 16px}
.xr-kicker{display:flex; align-items:center; gap:8px}
.xr-kicker .eye{font:600 12px/16px Archivo,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:#447c86}
.xr-hero .ver{background:#fff; border:1px solid #dedbd6; border-radius:999px; padding:2px 10px; font:500 13px/19.5px Archivo,sans-serif; color:#46443f}
.xr-hero h1{display:block; margin:8px 0 0; font:600 30px/36px Poppins,sans-serif; color:#0d1b2e; letter-spacing:0}
.xr-hero .meta{margin:8px 0 0; padding:0; border:0; gap:16px 32px}
.xr-hero .meta dt{font:600 12px/16px Archivo,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:#767c8a; margin:0 0 2px}
.xr-hero .meta dd{font:400 14px/20px Archivo,sans-serif; color:#1d2027}
.xr-actions{display:flex; flex-wrap:wrap; gap:12px}
.xr-actions .btn{border-radius:10px; padding:8px 12px; font:600 14px/20px Archivo,sans-serif; box-shadow:0 1px 1.5px rgba(0,0,0,.1), 0 1px 1px rgba(0,0,0,.1)}
.xr-actions .btn{background:#fafafa; border-color:#c2bfba; color:#46443f}
.xr-actions .btn.primary{background:#396770; border-color:#396770; color:#fff}
.xr-page .stats{gap:14px; margin:0 0 16px}
.xr-page .stat{background:#fff; border:1px solid #dedbd6; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px}
.xr-page .stat .lab{gap:10px; font:400 13px/19.5px Archivo,sans-serif; color:#5c5956}
.xr-ico{width:32px; height:32px; border-radius:8px; display:grid; place-items:center; flex:none}
.xr-ico.sqft,.xr-ico.pay{background:#e8f1f2}
.xr-ico.term{background:#e7f5ec}
.xr-ico.termn{background:#fdecec}
.xr-page .stat .val{margin:0; font:700 28px/24px Archivo,sans-serif; color:#1e1d1a; letter-spacing:0}
.xr-page .stat .val.phrase{font-size:19px; line-height:24px}
.xr-page .stat .val small{font:400 16px/24px Archivo,sans-serif; color:#5c5956}
.xr-page .stat .note{font:400 13px/19.5px Archivo,sans-serif; color:#5c5956}
.xr-page .link{font:500 13px/19.5px Archivo,sans-serif; color:#396770; gap:4px}
.xr-tabs{display:flex; gap:4px; background:#fff; border:1px solid #dedbd6; border-radius:12px; padding:6px; margin:0 0 16px; overflow:auto}
.xr-tabs button{height:36px; padding:0 14px; border:0; border-radius:10px; background:transparent; color:#5c5956; font:500 14px/20px Archivo,sans-serif; cursor:pointer; white-space:nowrap}
.xr-tabs button[aria-selected="true"]{background:#f3f8f9; color:#396770}
.xr-sections{display:flex; flex-direction:column; gap:14px}
.xr-sections.pair{display:grid; grid-template-columns:1fr 1fr; align-items:start}
.xr-sections .wide,.xr-hidden{grid-column:1 / -1}
.xr-hidden{margin:0}
.xr-page .sec,.xr-page .locked{margin:0; border-radius:12px; border-color:#dedbd6; background:#fff}
.xr-page .sec-h h2{font:600 16px/24px Archivo,sans-serif; color:#1e1d1a}
.xr-page .sec-h .src{font:400 12px/18px Archivo,sans-serif; color:#6b6b68}
.xr-page .ico{width:32px; height:32px; border-radius:8px}
@media (max-width:1100px){ .xr-page .stats,.xr-sections.pair{grid-template-columns:1fr 1fr} }
@media (max-width:720px){
  .page.xr-page{padding:0 14px 280px}
  .xr-backbar{margin:0 -14px 12px; padding:0 14px}
  .xr-hero .meta,.xr-page .stats,.xr-sections.pair{grid-template-columns:1fr}
  .xr-hero h1{font-size:24px; line-height:30px}
}
body.chat-open .shell{padding-right:360px}
@media (max-width:1100px){ body.chat-open .shell{padding-right:0} }
.eyebrow{color:var(--teal-text); font-size:11px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; margin:0 0 6px}
h1{font-size:28px; line-height:1.2; font-weight:600; letter-spacing:-.4px; margin:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.ver{font-size:11px; font-weight:500; border:1px solid var(--border-strong); color:var(--muted); border-radius:999px; padding:1px 7px; letter-spacing:0}
.sub{color:var(--muted); margin:8px 0 0; max-width:62ch}
.meta{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px 28px; margin:18px 0 0; padding-bottom:18px; border-bottom:1px solid var(--border)}
.meta dt{color:var(--muted); font-size:12.5px; margin-bottom:2px}
.meta dd{margin:0; font-size:13px}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 22px}
.btn{display:inline-flex; align-items:center; gap:6px; border-radius:6px; padding:7px 12px; font-size:13px; font-weight:500; border:1px solid var(--border-strong); background:var(--surface); cursor:pointer; white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--teal); border-color:var(--teal); color:var(--on-teal)}
.btn.primary:hover{background:var(--teal-strong); border-color:var(--teal-strong)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--teal-text)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.link{background:none; border:0; padding:0; color:var(--teal-text); font-size:12.5px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:5px}
.link:hover{text-decoration:underline}

/* stat cards */
.stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin-bottom:22px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px}
.stat .lab{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px}
.ico{width:26px; height:26px; border-radius:6px; display:grid; place-items:center; flex:none}
.ico svg.i{width:15px; height:15px}
.ico.grey{background:#f0efec; color:#6b6b68} .ico.green{background:var(--green-tint); color:var(--green)} .ico.blue{background:#eaf0fb; color:#3d64b8} .ico.red{background:var(--red-tint); color:var(--red)} .ico.teal{background:var(--teal-tint); color:var(--teal)} .ico.purple{background:var(--purple-tint); color:var(--purple)} .ico.amber{background:var(--amber-tint); color:var(--amber)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ico.grey{background:#262f33; color:#a4adaf} :root:not([data-theme="light"]) .ico.blue{background:#1d2840; color:#8fb0ee} }
.stat .val{font-size:24px; font-weight:500; margin:12px 0 2px; letter-spacing:-.3px}
.stat .val small{font-size:17px; color:var(--muted); font-weight:400}
.stat .note{color:var(--muted); font-size:12.5px}
.skel{height:10px; border-radius:4px; background:linear-gradient(90deg, var(--border) 0%, var(--surface-2) 100%); margin:14px 0 8px; width:70%}
.skel.s{width:45%; margin-top:0}

/* sections */
.sec{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-bottom:14px}
.sec-h{display:flex; align-items:center; gap:10px}
.sec-h h2{font-size:15px; font-weight:600; margin:0}
.sec-h .src{margin-left:auto; color:var(--faint); font-size:12px; white-space:nowrap}
.ic-btn{width:28px; height:28px; border:1px solid var(--border-strong); border-radius:6px; background:var(--surface); display:grid; place-items:center; cursor:pointer; color:var(--muted); flex:none}
.ic-btn:hover{color:var(--teal-text); border-color:var(--teal-border)}
.sec-body{margin-top:14px}
.sec p{margin:0 0 10px}
.lead{font-weight:600; margin:0 0 12px}
.sec.revealed{animation:reveal .5s ease}
@keyframes reveal{from{box-shadow:0 0 0 3px var(--teal-border)} to{box-shadow:0 0 0 0 transparent}}
.locked{display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px dashed var(--border-strong); border-radius:10px; padding:12px 14px; margin-bottom:10px; color:var(--muted)}
.locked h2{font-size:14px; font-weight:600; margin:0; color:var(--text)}
.locked .why{font-size:12.5px}
.locked .grow{flex:1; min-width:0}
.locked .btn{padding:5px 10px; font-size:12.5px}
.tag{display:inline-block; font-size:11px; font-weight:600; border-radius:999px; padding:1px 7px; border:1px solid; white-space:nowrap}
.tag.proposed{color:var(--purple); border-color:var(--purple-tint); background:var(--purple-tint)}
.tag.high{color:var(--red); border-color:var(--red); background:var(--red-tint)}
.tag.med{color:var(--amber); border-color:var(--amber); background:var(--amber-tint)}
.tag.won{color:var(--green); border-color:transparent; background:var(--green-tint)}
.tag.lost{color:var(--muted); border-color:transparent; background:#efeeeb}
.tag.bidding{color:var(--teal-text); border-color:transparent; background:var(--teal-tint)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.lost{background:#262f33} }
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:12px; border:1px solid var(--border-strong); border-radius:5px; padding:2px 8px; color:var(--text); background:var(--surface)}
.kv{display:grid; grid-template-columns:200px minmax(0,1fr); gap:10px 18px; font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.rows > div{display:grid; grid-template-columns:170px minmax(0,1fr); gap:16px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px}
.rows > div:last-child{border-bottom:0}
.rows .k{color:var(--muted)}
.hr{height:1px; background:var(--border); margin:14px 0}
.muted{color:var(--muted)} .small{font-size:12.5px}
ul.plain{margin:0; padding-left:16px} ul.plain li{margin:3px 0}

/* tables */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-weight:500; color:var(--muted); font-size:12px; background:var(--surface-2); padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap}
td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top}
tr:last-child td{border-bottom:0}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
tr.hl td{background:var(--amber-tint)}
tr.group td{background:var(--surface-2); font-weight:600}

/* pipeline */
.seg{display:inline-flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px; margin:20px 0 14px}
.seg button{border:0; background:transparent; padding:6px 12px; border-radius:6px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal-tint); color:var(--teal-text); font-weight:600}
.pipe{background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden}
.pipe tr.row{cursor:pointer}
.pipe tr.row:hover td{background:var(--surface-2)}
.pipe tr.mystery td{background:var(--teal-tint)}
.pipe tr.mystery:hover td{background:var(--teal-tint)}
.fac{font-weight:600}
.fac-sub{color:var(--muted); font-size:12px; font-weight:400}
.guess-me{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--on-teal); background:var(--teal); border-radius:999px; padding:2px 8px; margin-left:8px; vertical-align:1px}
.row-act{color:#396770; font:600 13px/20px Archivo,sans-serif; display:inline-flex; gap:5px; align-items:center; white-space:nowrap}
.row-act svg.i{width:14px; height:14px}

/* pipeline skin */
.pl-head{display:flex; flex-direction:column; gap:4px; margin:0 0 24px}
.pl-head h1{font:600 31px/38.75px Archivo,sans-serif; letter-spacing:-.31px; color:#1e1d1a; margin:0}
.pl-count{margin:0; font:400 15px/22.5px Archivo,sans-serif; color:#5c5956}
.pl-sub{margin:2px 0 0; font:400 15px/22.5px Archivo,sans-serif; color:#5c5956; max-width:70ch}
.pl-stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; margin:0 0 20px}
.pl-stat{background:#fff; border:1px solid #dedbd6; border-radius:16px; padding:20px; box-shadow:0 1px 1px rgba(0,0,0,.05); display:flex; flex-direction:column; gap:12px; text-align:left; color:inherit; font:inherit; width:100%}
button.pl-stat{cursor:pointer}
button.pl-stat:hover{border-color:#c2bfba}
.pl-stat .lab{display:flex; align-items:center; justify-content:space-between; gap:12px; font:600 12px/18px Archivo,sans-serif; letter-spacing:.72px; text-transform:uppercase; color:#5c5956}
.pl-ico{width:32px; height:32px; border-radius:10px; display:grid; place-items:center; flex:none}
.pl-ico.open{background:#f3f8f9}
.pl-ico.wait{background:#eef4ff}
.pl-ico.val{background:#edfbf2}
.pl-ico.due{background:#fff7ed}
.pl-ico img{display:block}
.pl-stat b{display:block; font:700 33px/49.5px Archivo,sans-serif; color:#1e1d1a; font-weight:700}
.pl-stat b.open{color:#b54708}
.pl-stat b.dash{color:#5c5956}
.pl-stat b.due{font-size:22px; line-height:33px; color:#1e1d1a}
.pl-stat b.due.late{color:#d42020}
.pl-stat .note{display:block; margin-top:4px; font:400 13px/19.5px Archivo,sans-serif; color:#5c5956; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* tray */
.tray{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--tray-bg); border-top:1px solid var(--border); box-shadow:var(--shadow-up); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.tray-in{display:flex; align-items:stretch; gap:16px; max-width:1400px; margin:0 auto}
.hand{flex:none; width:128px; display:flex; flex-direction:column; justify-content:center; gap:6px}
.hand .t{font-weight:600; font-size:13px}
.pips{display:flex; gap:6px}
.pip{width:22px; height:30px; border-radius:4px; border:1.5px solid var(--teal); background:var(--teal)}
.pip.used{background:transparent; border-style:dashed; border-color:var(--border-strong)}
.hand .h{font-size:11.5px; color:var(--muted); line-height:1.35}
.cards{flex:1; min-width:0; display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; scroll-snap-type:x proximity}
.card{flex:none; width:150px; min-height:96px; text-align:left; border:1px solid var(--teal-border); background:var(--surface); border-radius:9px; padding:9px 10px; display:flex; flex-direction:column; gap:4px; cursor:pointer; scroll-snap-align:start; position:relative; transition:transform .12s ease, box-shadow .12s ease}
.card:hover:not([aria-disabled="true"]){transform:translateY(-2px); box-shadow:0 6px 16px rgba(20,30,35,.1)}
.card .top{display:flex; align-items:center; gap:6px; color:var(--teal)}
.card .cost{margin-left:auto; font-size:11px; color:var(--muted); font-weight:500}
.card .nm{font-weight:600; font-size:12.5px; line-height:1.25}
.card .bl{font-size:11.5px; color:var(--muted); line-height:1.3}
.card .ft{margin-top:auto; display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.card.played{background:var(--teal-tint); border-color:var(--teal)}
.card.played .cost{color:var(--teal-text); font-weight:600}
.card.locked-c{border-style:dashed; border-color:var(--border-strong); background:var(--surface-2)}
.card.locked-c .top{color:var(--faint)}
.card.locked-c .nm{color:var(--muted)}
.card.out{opacity:.45}
.req{font-size:11px; color:var(--muted); display:inline-flex; gap:3px; align-items:center}
.req svg.i{width:11px; height:11px}
/* tray card, Figma 3902:10723 */
.card.hc{width:160.5px; height:185.25px; min-height:0; border:0; border-radius:6px; background:var(--surface); padding:12px 12px 12px 24px; gap:15px; overflow:hidden; align-items:flex-start; color:var(--card-ink)}
.card.hc .deco{position:absolute; left:0; top:0; width:161px; height:186px; color:var(--deco); pointer-events:none}
.card.hc > :not(.deco){position:relative}
.card.hc .top{width:100%; justify-content:space-between; color:var(--card-ink)}
.card.hc .top svg.i{width:18px; height:18px; stroke-width:1.5}
.card.hc .cost{font:400 10.5px/15px Archivo,Geist,system-ui,sans-serif; color:var(--card-ink); display:inline-flex; align-items:center; gap:3px}
.card.hc .cost svg.i{width:12px; height:12px}
.card.hc .body{display:flex; flex-direction:column; gap:6px; width:100%}
.card.hc .nm{font:600 12px/1.2 Poppins,Geist,system-ui,sans-serif; color:var(--text)}
.card.hc .dsc{display:flex; flex-direction:column; gap:3px; width:97.5px}
.card.hc .bl{font:400 12px/18px Archivo,Geist,system-ui,sans-serif; color:var(--text)}
.card.hc .src{font:400 9px/13.5px Archivo,Geist,system-ui,sans-serif; color:var(--text)}
.card.hc .ft{margin-top:0; gap:4px}
.card.hc .ft:empty{display:none}
.lockpill{display:inline-flex; align-items:center; gap:3px; background:var(--mint); color:var(--on-mint); border-radius:999px; padding:1.5px 6px; font:400 9px/13.5px Archivo,Geist,system-ui,sans-serif; white-space:nowrap}
.lockpill svg{width:12px; height:12px; flex:none}
.card.hc .tag{font-size:9px; line-height:13.5px; padding:0 6px}
.card.hc.locked-c{border:.75px dashed var(--deco-locked); background:var(--surface)}
.card.hc.locked-c .deco{color:var(--deco-locked)}
.card.hc.locked-c .top, .card.hc.locked-c .body{opacity:.5}
.card.hc.locked-c .top{color:var(--card-ink)}
.card.hc.locked-c .nm{color:var(--text)}
.card.hc.played{background:var(--teal-tint); box-shadow:inset 0 0 0 1.5px var(--teal)}
.card.hc.played .cost{color:var(--teal-text)}
.tray-r{flex:none; display:flex; flex-direction:column; justify-content:center; gap:6px; align-items:stretch; width:170px}
.tray-r .btn{justify-content:center; padding:10px 12px; font-size:14px}
.locked-note{font-size:12px; color:var(--muted); text-align:center}
.done-bar{flex:1; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.done-bar .big{font-size:18px; font-weight:600}
@media (max-width:720px){
  .page{padding:20px 14px 300px}
  .page.pipe-page{padding:20px 14px 280px}
  .meta{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr; gap:2px 0} .kv dd{margin-bottom:8px}
  .rows > div{grid-template-columns:1fr; gap:2px}
  .tray-in{flex-wrap:wrap; gap:10px}
  .hand{width:auto; flex-direction:row; align-items:center; gap:10px}
  .hand .h{display:none}
  .tray-r{width:auto; flex:1; order:2; flex-direction:row; justify-content:flex-end}
  .cards{order:3; flex-basis:100%}
  .crumbs .hide-s{display:none}
  .nav-btn.hide-s, .who .nm{display:none}
}

/* chat */
.chat{position:fixed; top:calc(env(safe-area-inset-top,0px) + 64px); right:0; bottom:0; width:360px; z-index:26; background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s ease; padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
body.chat-open .chat{transform:none}
@media (max-width:720px){ .chat{width:100%; padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))} }
.chat-h{display:flex; align-items:center; padding:12px 14px; font-weight:600; font-size:13px}
.chat-h .ic-btn{margin-left:auto; border:0}
.chat-b{flex:1; overflow-y:auto; padding:6px 14px 10px; display:flex; flex-direction:column; gap:14px}
.msg .who2{font-size:11.5px; font-weight:600; margin-bottom:3px}
.msg .ttl{font-weight:600; font-size:13px; margin-bottom:2px}
.msg .tx{font-size:13px; color:var(--text)}
.msg.you .tx{border:1px solid var(--border-strong); border-radius:8px; padding:8px 10px; background:var(--surface-2)}
.typing{display:inline-flex; gap:4px} .typing span{width:6px; height:6px; border-radius:50%; background:var(--faint); animation:blink 1s infinite} .typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25} 50%{opacity:1}}
.scope{display:flex; gap:14px; padding:0 14px 8px}
.scope button{background:none; border:0; padding:2px 0; font-size:12px; font-weight:500; color:var(--teal-text); cursor:pointer; border-bottom:1.5px solid transparent}
.scope button[aria-pressed="true"]{border-bottom-color:var(--teal); font-weight:600}
.prompts{padding:0 14px 10px; display:flex; flex-direction:column; gap:6px}
.prompt{display:flex; align-items:center; gap:8px; text-align:left; border:1px solid var(--teal-border); background:var(--teal-tint); color:var(--teal-text); border-radius:8px; padding:8px 10px; font-size:12.5px; cursor:pointer}
.prompt:hover:not([disabled]){border-color:var(--teal)}
.prompt .c{margin-left:auto; font-size:11px; white-space:nowrap; color:var(--muted)}
.prompt[disabled]{opacity:.5; cursor:default}
.chat-in{margin:0 14px 14px; border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; color:var(--faint); font-size:13px}
.chat-in .row2{display:flex; justify-content:space-between; align-items:center; margin-top:14px}
.send{width:24px; height:24px; border-radius:50%; background:#efeeeb; display:grid; place-items:center; color:var(--muted)}

/* modals */
.scrim{position:fixed; inset:0; z-index:50; background:var(--scrim); display:grid; place-items:safe center; padding:max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); overflow:auto; animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface); border-radius:12px; width:min(520px, 100%); max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow:auto; box-shadow:0 24px 64px rgba(0,0,0,.25)}
.dlg.wide{width:min(640px,100%)}

.dlg label{font-size:12.5px; color:var(--muted); font-weight:500}
.dlg input[type=text], .dlg input[type=email]{font:inherit; font-size:16px; padding:9px 11px; border:1px solid var(--border-strong); border-radius:7px; background:var(--surface); color:var(--text)}
.dlg input:focus{outline:2px solid var(--teal-border); border-color:var(--teal)}
.dlg-f{display:flex; justify-content:flex-end; gap:8px; padding:14px 24px; background:var(--surface-2); border-top:1px solid var(--border); border-radius:0 0 12px 12px; align-items:center}
.dlg-f .left{margin-right:auto}
.info{background:var(--teal-tint); border:1px solid var(--teal-border); color:var(--teal-text); border-radius:8px; padding:11px 13px; font-size:13px}
.steps{list-style:none; margin:14px 0 0; padding:0; border:1px solid var(--border); border-radius:8px}
.steps li{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border); font-size:13px}
.steps li:last-child{border-bottom:0}
.circ{width:18px; height:18px; border-radius:50%; border:1.5px solid var(--border-strong); flex:none; display:grid; place-items:center}
.circ.spin{border-color:var(--teal); border-right-color:transparent; animation:spin .7s linear infinite}
.circ.ok{border-color:var(--green); color:var(--green)} .circ.ok svg.i{width:11px; height:11px; stroke-width:2.5}

.bar{height:5px; background:var(--border); border-radius:3px; margin-top:16px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--teal); border-radius:3px; transition:width .35s ease}
.money{display:flex; align-items:center; border:1px solid var(--border-strong); border-radius:8px; padding:0 12px; margin-top:16px; background:var(--surface)}
.money span{font-size:26px; color:var(--muted)}
.money input{flex:1; min-width:0; border:0 !important; outline:none !important; font:inherit; font-size:30px !important; font-weight:600; padding:12px 8px !important; background:transparent !important; color:var(--text); font-variant-numeric:tabular-nums}
.money .per{font-size:14px}
.money:focus-within{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-border)}
.err{color:var(--red); font-size:12.5px; margin-top:6px; min-height:18px}
.played-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.bigcheck{width:56px; height:56px; border-radius:50%; background:var(--green-tint); color:var(--green); display:grid; place-items:center; margin-bottom:14px}
.bigcheck svg.i{width:28px; height:28px; stroke-width:2.2}
.amount{font-size:34px; font-weight:600; letter-spacing:-.5px; margin:6px 0 4px; font-variant-numeric:tabular-nums}
.demo-note{font-size:12px; color:var(--faint); margin-top:12px}

/* ===== Guess locked modal — all classes prefixed gl- =====
   Uses the demo's tokens (--surface, --teal, etc.) with fallbacks,
   so it inherits light/dark mode when dropped into the demo. */
.gl-root{
  --gl-gold-hi:#ffe9a3; --gl-gold:#f2b632; --gl-gold-lo:#b57a12; --gl-gold-edge:#7a4f06;
  --gl-bulb-on:#fff6d6; --gl-bulb-glow:#ffd45c; --gl-bulb-off:#c9952a;
  --gl-stage:#163a5c; --gl-stage-hi:#1f5486; --gl-stage-line:#2a6aa6; --gl-stage-muted:#b9cde0;

function tryCard(id){
  if (state.guess) return;
  var c = card(id), s = cardState(c);
  if (id==='chat'){ openChat(true); return; }
  if (s==='played'){ if (SECTIONS[id]){ state.lastRevealed = id; go('bid'); } return; }
  if (s==='locked'){ toast(c.unreachable ? 'Staffing plan needs Floor breakdown and Production rates: four cards. It appears in the results email.' : c.name+' unlocks after '+c.req.map(function(r){return card(r).name;}).join(' + ')+'.'); return; }
  if (s==='out'){ toast(left() ? c.name+' costs '+(c.cost||1)+' cards. You have '+left()+' left.' : 'No cards left. Lock in your guess.'); return; }
  if (id==='won'){ state.filter='won'; go('pipeline'); toast('Choose a won bid to open its live dashboard.'); return; }
  play(id);
}
function play(id, after){

    '<div class="info">Jain is examining the RFP and your data. Every finding points back to its source.</div><ul class="steps">'+
    steps.map(function(s,i){ return '<li><span class="circ" id="st'+i+'"></span>'+esc(s)+'</li>'; }).join('')+'</ul><div class="bar"><i id="pbar"></i></div></div></div></div>';
  var fast = matchMedia('(prefers-reduced-motion: reduce)').matches, dt = fast ? 120 : 480, i = 0;
  function tick(){
    if (i>0){ var p = $('#st'+(i-1)); p.className='circ ok'; p.innerHTML = ic('check'); }
    if (i<steps.length){ $('#st'+i).className='circ spin'; $('#pbar').style.width = ((i+0.5)/steps.length*100)+'%'; i++; setTimeout(tick, dt); }
    else { $('#pbar').style.width='100%'; setTimeout(function(){
      m.innerHTML=''; state.played.push(id);
      if (after) after(); else { state.lastRevealed = id; go('bid'); }
      toast(c.name+' played. '+left()+' card'+(left()===1?'':'s')+' left.');
    }, dt/2); }
  }
  tick();
}

/* GuessLocked.play(amount) runs the sequence. Call it again to replay. */
var GuessLocked = (function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [], lightTimer = null, bulbs = [], parts = [], raf = null, cv, cx;
  function later(fn, ms){ timers.push(setTimeout(fn, reduce ? 0 : ms)); }
  function money(n){ return '$' + Math.round(n).toLocaleString('en-US'); }

  /* confetti */
  function ensureCanvas(){

  function burst(x, y, angle, spread, count, power){

      parts.push({ x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, w:6+Math.random()*6, h:3+Math.random()*4, r:Math.random()*6.28, vr:(Math.random()-.5)*.35, c:cols[i % cols.length], life:0 });
    }
    if (!raf) raf = requestAnimationFrame(tick);

    art:function(){ return "<svg id=\"h5link\" aria-hidden=\"true\"><path id=\"h5path\" d=\"M150 150 C 236 150, 236 80, 262 80\"><\/path><path id=\"h5path2\" d=\"M216 244 C 238 244, 240 238, 262 238\"><\/path><\/svg><button type=\"button\" id=\"h5wrap\" aria-label=\"Play the practice card: Procurement timeline\"><div class=\"f3\" id=\"h5flip\"><div class=\"fc fr pulse\" id=\"h5front\"><span class=\"ic\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15\" rx=\"2\"><\/rect><path d=\"M3.5 10h17M8 3v4M16 3v4\"><\/path><\/svg><span>Free<\/span><\/span><b>Procurement timeline<\/b><span class=\"h1meta\">Key dates for this RFP<\/span><\/div><div class=\"fc xr bk\"><div class=\"xbar\">Bid X-Ray<\/div><div class=\"xbody\"><span class=\"lbl\">Procurement timeline<\/span><div class=\"tl2\"><div><b>Oct 6<\/b><span>RFP released<\/span><\/div><div><b>Nov 18<\/b><span>Site walk<\/span><\/div><div><b>Nov 24<\/b><span>Q&amp;A closes<\/span><\/div><div class=\"due\"><b>Dec 4<\/b><span>Bid due, 2:00 PM<\/span><\/div><\/div><span class=\"srcchip\" id=\"h5src\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6V3Z\"><\/path><path d=\"M14 3v4h4\"><\/path><\/svg>From the RFP<\/span><\/div><\/div><\/div><\/button><div id=\"h5rfp\" aria-hidden=\"true\"><span class=\"t\">RFP<\/span><i><\/i><i style=\"width:80%\"><\/i><i><\/i><i class=\"h\" id=\"h5hl\"><\/i><i style=\"width:70%\"><\/i><i><\/i><i style=\"width:60%\"><\/i><\/div><div class=\"mc\" id=\"h5lab\"><div class=\"mcb\"><span class=\"mci\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M15 9.2c-.6-1-1.7-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.4 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3.1-1.6M12 6v1.7M12 16.5v1.7\"><\/path><\/svg><\/span><b>Local labor market<\/b><span>Wage floor and burden<\/span><\/div><span class=\"srcchip jain\" id=\"h5src2\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z\"><\/path><circle cx=\"12\" cy=\"9\" r=\"2.5\"><\/circle><\/svg>From Jain intelligence<\/span><\/div><div id=\"h5jain\" aria-hidden=\"true\"><div class=\"jh\"><span class=\"jsp\" id=\"h5spark\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z\"><\/path><path d=\"M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z\"><\/path><\/svg><\/span>Jain intelligence<\/div><div class=\"jq\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M20 20l-3.5-3.5\"><\/path><\/svg><i id=\"h5q\"><\/i><span class=\"caret\"><\/span><\/div><div class=\"jr\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9S14.5 18.5 12 21M12 3C9.5 5.5 8.2 8.5 8.2 12s1.3 6.5 3.8 9\"><\/path><\/svg><i style=\"width:80%\"><\/i><\/div><div class=\"jr\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9S14.5 18.5 12 21M12 3C9.5 5.5 8.2 8.5 8.2 12s1.3 6.5 3.8 9\"><\/path><\/svg><i style=\"width:62%\"><\/i><\/div><div class=\"jr\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9S14.5 18.5 12 21M12 3C9.5 5.5 8.2 8.5 8.2 12s1.3 6.5 3.8 9\"><\/path><\/svg><i style=\"width:72%\"><\/i><\/div><\/div><div id=\"h5tap\">Tap to play<\/div><div id=\"h5cursor\"><\/div>"; },
    run:function(){
      htpFlipped=false;
      var w=htpEl('h5wrap'); if(!w) return;
      w.onclick=function(e){ e.stopPropagation(); if(htpFlipped) return; htpFlipped=true; htpTimers.forEach(clearTimeout); htpTimers=[];
        htpEl('h5front').classList.remove('pulse'); htpEl('h5tap').style.opacity=0; htpEl('h5flip').style.transform='rotateY(180deg)'; htpTrace(); };
      if (HTP_REDUCE) return;
      var hint=function(){ if(htpFlipped||!htpEl('h5cursor')||htpStep!==4) return; htpA(htpEl('h5cursor'),[{opacity:0,left:'230px',top:'320px'},{opacity:1,left:'105px',top:'84px',offset:.5},{opacity:1,left:'105px',top:'84px',transform:'scale(.7)',offset:.65},{opacity:0,left:'105px',top:'84px',transform:'scale(1)'}],{duration:1500,fill:'none'}); htpAt(4000,hint); };
      htpAt(2800,hint);
    } },
  { t:'Lock in your guess', p:'Closest without going over wins. Results arrive by email after ISSA.', aside:'The top 3 are announced, along with Jain\u2019s own estimate.',
    art:function(){ return '<div id="h6input"><span class="d">$</span><span class="odo" id="odo"></span><span class="yr">/ yr</span></div><div id="h6stamp">LOCKED IN</div>'+
      '<span id="h6env">'+ic('mail')+'</span><div id="h6mail">'+ic('mail')+'Results by email after ISSA</div>'; },
    run:function run(){
      var o=htpEl('odo'); if(!o) return; var G='1,250,000'; o.innerHTML='';
      G.split('').forEach(function(ch){ if(ch===','){ var s=document.createElement('span'); s.className='sep'; s.textContent=','; o.appendChild(s); return; }
        var c=document.createElement('span'); c.className='col'; c.dataset.t=ch; for(var r=0;r<3;r++) for(var d=0;d<10;d++){ var x=document.createElement('span'); x.textContent=d; c.appendChild(x); } o.appendChild(c); });
      var cols=[].slice.call(o.querySelectorAll('.col')), st=htpEl('h6stamp'), mail=htpEl('h6mail'), env=htpEl('h6env'); st.style.opacity=0; mail.style.opacity=0;
      var y=function(c){ return 'translateY(-'+((20+ +c.dataset.t)*40)+'px)'; };
      if (HTP_REDUCE){ cols.forEach(function(c){ c.style.transform=y(c); }); st.style.opacity=1; mail.style.opacity=1; return; }
      cols.forEach(function(c,i){ htpA(c,[{transform:'translateY(0)'},{transform:y(c)}],{duration:1100+i*160,delay:300,easing:'cubic-bezier(.2,.9,.25,1.05)'}); });
      htpAt(2500,function(){ htpA(st,[{transform:'scale(3) rotate(-25deg)',opacity:0},{transform:'scale(1) rotate(-10deg)',opacity:1}],{duration:280,easing:'cubic-bezier(.6,0,.9,.4)'});
        htpAt(280,function(){ var dlg=$('#modal .dlg'); if(dlg) htpA(dlg,[{transform:'translate(0,0)'},{transform:'translate(-3px,2px)'},{transform:'translate(3px,-2px)'},{transform:'none'}],{duration:220,fill:'none'}); htpBurst(st,'var(--green)'); }); });
      htpAt(3400,function(){ htpA(env,[{opacity:1,transform:'translate(0,0) rotate(0)'},{opacity:1,transform:'translate(150px,-40px) rotate(-12deg)',offset:.6},{opacity:0,transform:'translate(320px,-120px) rotate(-20deg) scale(.5)'}],{duration:900,easing:'cubic-bezier(.5,0,.6,1)'});
        htpA(mail,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:400,delay:600}); });
      htpAt(7500,function(){ if(htpStep===5) run(); });
    } }
];
function htpTrace(){
  var rfp=htpEl('h5rfp'), path=htpEl('h5path'), src=htpEl('h5src'), hl=htpEl('h5hl');
  var lab=htpEl('h5lab'), jain=htpEl('h5jain'), path2=htpEl('h5path2'), src2=htpEl('h5src2');
  if (HTP_REDUCE){ rfp.style.opacity=1; path.style.opacity=1; lab.style.opacity=1; jain.style.opacity=1; jain.classList.add('done'); path2.style.opacity=1; return; }
  htpAt(2300,function(){ lab.style.opacity=1; htpA(lab,[{opacity:0,transform:'translateY(40px) rotate(-4deg)'},{opacity:1,transform:'none'}],{duration:650,easing:HTP_SPRING}); });
  htpAt(3000,function(){ htpA(src2,[{transform:'scale(1)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:450,easing:HTP_SPRING,fill:'none'}); });
  htpAt(3300,function(){ path2.style.opacity=1; var L=path2.getTotalLength(); htpA(path2,[{strokeDashoffset:L,strokeDasharray:''+L},{strokeDashoffset:0,strokeDasharray:''+L}],{duration:450,easing:'ease-in-out'});
    jain.style.opacity=1; htpA(jain,[{opacity:0,transform:'translateX(30px) rotate(6deg)'},{opacity:1,transform:'none'}],{duration:550,easing:HTP_SPRING}); });
  htpAt(3700,function(){ htpA(htpEl('h5q'),[{width:'0px'},{width:'46px'}],{duration:700,easing:'steps(9,end)'}); });
  htpAt(3700,function(){ htpA(htpEl('h5spark'),[{transform:'rotate(0) scale(1)'},{transform:'rotate(180deg) scale(1.4)'},{transform:'rotate(360deg) scale(1)'}],{duration:1600,iterations:2,fill:'none'}); });
  [].forEach.call(jain.querySelectorAll('.jr'),function(r,i){ htpAt(4500+i*260,function(){ htpA(r,[{opacity:0,transform:'translateX(-10px)'},{opacity:1,transform:'none'}],{duration:380,easing:HTP_SPRING}); }); });
  htpAt(5400,function(){ jain.classList.add('done'); htpBurst(htpEl('h5spark')); });
  htpAt(700,function(){ htpA(src,[{transform:'scale(1)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:450,easing:HTP_SPRING,fill:'none'}); });
  htpAt(1000,function(){ path.style.opacity=1; var L=path.getTotalLength(); htpA(path,[{strokeDashoffset:L,strokeDasharray:''+L},{strokeDashoffset:0,strokeDasharray:''+L}],{duration:550,easing:'ease-in-out'});
    htpA(rfp,[{opacity:0,transform:'translateX(30px) rotate(6deg)'},{opacity:1,transform:'none'}],{duration:550,easing:HTP_SPRING}); rfp.style.opacity=1; });
  htpAt(1650,function(){ htpA(hl,[{transform:'scaleX(.2)'},{transform:'scaleX(1)'}],{duration:400}); htpAt(350,function(){ htpBurst(hl,'var(--amber)'); }); });
}
function htpDeal(from){
  if (state.played.length || state.guess) return;
  var pips = [].slice.call(document.querySelectorAll('#tray .pips .pip'));
  pips.forEach(function(p){ p.classList.add('used'); });
  pips.forEach(function(p,i){
    if (HTP_REDUCE){ p.classList.remove('used'); return; }
    var to=p.getBoundingClientRect(), sx=from.left+from.width/2-11, sy=from.top+from.height/2-15;
    var g=document.createElement('div'); g.className='ghostcard'; g.style.left=sx+'px'; g.style.top=sy+'px'; document.body.appendChild(g);
    g.animate([{transform:'rotate(-30deg) scale(2.2)',opacity:0},{opacity:1,offset:.15},{transform:'translate('+(to.left-sx)+'px,'+(to.top-sy)+'px) rotate(0) scale(1)',opacity:1}],{duration:700,delay:200+i*150,easing:'cubic-bezier(.3,.7,.2,1)',fill:'forwards'})
      .onfinish=function(){ g.remove(); p.classList.remove('used'); p.animate([{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:380,easing:HTP_SPRING}); };
  });
}
function htpClose(){
  var d=$('#modal .dlg'), from = d ? d.getBoundingClientRect() : null;
  htpStop(); closeModal(); if (from) htpDeal(from);
}
function openWizard(i){
  i = i||0; if (i===0) htpFlipped=false;
  htpStop(); htpStep=i; var w=HTP[i], last=i===HTP.length-1;
  var dots = HTP.map(function(_,k){ return '<span'+(k===i?' class="on"':'')+'></span>'; }).join('');
  modal('<div class="htp"><div class="htp-art" id="htpArt" title="Tap to replay">'+w.art()+(i!==4?'<span class="replay">\u21bb Tap to replay</span>':'')+'</div>'+
    '<div class="htp-txt"><h3 id="wzT">'+w.t+'</h3><p>'+w.p+'</p>'+(w.aside?'<p class="aside">'+w.aside+'</p>':'')+'</div></div>'+
    '<div class="dlg-f"><div class="dots" aria-hidden="true">'+dots+'</div>'+
    (i>0 ? '<button class="btn" type="button" id="wzBack">Back</button>' : '<button class="btn ghost" type="button" id="wzSkip">Skip</button>')+
    '<button class="btn primary" type="button" id="wzNext">'+(last?'Start playing':'Next')+'</button></div>', true);
  var dlg=$('#modal .dlg'); dlg.classList.add('htp-dlg'); dlg.setAttribute('aria-labelledby','wzT');
  w.run();
  $('#wzNext').focus();
  $('#wzNext').onclick = function(){ if (last) htpClose(); else openWizard(i+1); };
  if ($('#wzBack')) $('#wzBack').onclick = function(){ openWizard(i-1); };
  if ($('#wzSkip')) $('#wzSkip').onclick = htpClose;
  $('#htpArt').onclick = function(){ if (i!==4){ htpStop(); w.run(); } };
  dlg.onkeydown = function(ev){ if (ev.key==='ArrowRight' && !last) openWizard(i+1); if (ev.key==='ArrowLeft' && i>0) openWizard(i-1); };
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('button, tr.row, [data-scrim]');
  if (!t) return;
  if (t.hasAttribute('data-scrim')){ if (e.target===t && state.player) closeModal(); return; }
  if (t.dataset.go){ go(t.dataset.go); return; }
  if (t.dataset.filter){ state.filter = t.dataset.filter; render(); return; }
  if (t.dataset.xrtab){ state.xrtab = t.dataset.xrtab; render(); return; }
  if (t.dataset.row){ rowClick(t.dataset.row); return; }
  if (t.dataset.card){ tryCard(t.dataset.card); return; }
  if (t.dataset.play){ tryCard(t.dataset.play); return; }
  if (t.hasAttribute('data-openchat')){ openChat(true); return; }
  if (t.dataset.scope){ state.scope = t.dataset.scope; renderChat(); return; }
  if (t.dataset.ask){ ask(t.dataset.ask); return; }
  if (t.hasAttribute('data-close')){ closeModal(); return; }
  if (t.hasAttribute('data-inert')){ toast('Not part of the game in this demo.'); return; }
  if (t.hasAttribute('data-newplayer')){ reset(); return; }
  if (t.id==='lockIn'){ openGuess(); return; }
  if (t.id==='previewMail'){ openMail(); return; }
  if (t.id==='chatClose'){ openChat(false); return; }
  if (t.id==='howTo'){ if (state.player) openWizard(0); return; }
  if (t.id==='newPlayer'){ if (state.played.length && !state.guess){ modal('<div class="dlg-b"><h3>Start a new player?</h3><p class="muted" style="margin:0">This round\u2019s cards and guess will be cleared.</p></div><div class="dlg-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-newplayer>New player</button></div>'); } else reset(); return; }
});
document.addEventListener('input', function(e){
  if (e.target.id!=='pipeQ' && e.target.id!=='navSearch') return;
  state.q = e.target.value;
  if (state.view!=='pipeline') return;
  if (e.target.id==='pipeQ'){
    var pos = e.target.selectionStart;
    render();
    var el = $('#pipeQ');
    if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
  } else render();
});
document.addEventListener('keydown', function(e){
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); var s=$('#navSearch'); if (s) s.focus(); return; }
  if (e.key==='Escape'){ if ($('#modal').innerHTML && state.player && !document.querySelector('#pt')) closeModal(); else if (state.chatOpen) openChat(false); }
  if ((e.key==='Enter' || e.key===' ') && e.target.matches && e.target.matches('tr.row')){ e.preventDefault(); rowClick(e.target.dataset.row); }
});
function rowClick(id){
  var p = PIPE.filter(function(r){return r.id===id;})[0];
  if (p.mystery){ go('bid'); return; }
  if (p.status==='won'){ openWon(id); return; }
  toast(p.status==='lost' ? 'Lost bids show price and status only. Ask about them in chat.' : 'This draft isn\u2019t part of the game.');
}
function reset(){ state = fresh(); closeModal(); render(); openCheckin(); }

$('#chatClose').innerHTML = ic('x');
$('#upIc').innerHTML = ic('upload');
$('#sendIc').innerHTML = ic('arrow');
render();
openCheckin();
})();
</script>
